<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Eokay AI Video Studio - Professional SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
                <i class="fas fa-video-slash mr-2"></i> Automation Eokay AI
            </h1>
            <span class="bg-purple-900/50 text-purple-300 text-xs px-3 py-1 rounded-full border border-purple-700/50">Pro SaaS v2.0</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl w-full mx-auto p-4 space-y-6 mb-20">
        
        <!-- Status Alert Box -->
        <div id="alertBox" class="hidden p-3 rounded-lg text-sm border"></div>

        <!-- VIDEO RECAP NV SECTION -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-lg font-semibold text-purple-400 flex items-center mb-3">
                <i class="fas fa-film mr-2"></i> VIDEO RECAP NV
            </h2>
            <p class="text-xs text-slate-400 mb-4">Google AI Studio API ဖြင့် မြန်မာဘာသာသာ Recap Video ထုတ်လုပ်ရန်</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Google AI API Key</label>
                    <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Narration Style</label>
                        <select id="narrationStyle" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                            <option value="story">Story Mode - ဇာတ်ကောင်စုံစုံ (YouTube)</option>
                            <option value="summary">Summary Mode - အနှစ်ချုပ်</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Voice Mode</label>
                        <select id="voiceMode" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                            <option value="male">Thiha (Burmese Native - Male)</option>
                            <option value="female">May (Burmese Native - Female)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Upload Video for Recap</label>
                    <input type="file" id="recapVideoFile" accept="video/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700 cursor-pointer">
                </div>

                <button onclick="generateRecap()" id="recapBtn" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium py-3 rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
                    <i class="fas fa-wand-magic-sparkles"></i>
                    <span>GENERATE RECAP</span>
                </button>
            </div>
        </section>

        <!-- NOVA CUT VIDEO SECTION -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-lg font-semibold text-rose-400 flex items-center mb-3">
                <i class="fas fa-cut mr-2"></i> NOVA CUT VIDEO
            </h2>
            <p class="text-xs text-slate-400 mb-4">ဗီဒီယိုများကို လိုသလို အပိုင်းပိုင်း ဖြတ်တောက်ရန်</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Select Video File</label>
                    <input type="file" id="cutVideoFile" accept="video/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-rose-600 file:text-white hover:file:bg-rose-700 cursor-pointer">
                </div>

                <button onclick="cutVideo()" id="cutBtn" class="w-full bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-medium py-3 rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
                    <i class="fas fa-scissors"></i>
                    <span>CUT VIDEO</span>
                </button>
            </div>
        </section>

        <!-- Result Console / Output Area -->
        <section id="outputSection" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <h3 class="text-sm font-semibold text-emerald-400 mb-2"><i class="fas fa-terminal mr-1"></i> Processing Output</h3>
            <div id="outputConsole" class="bg-slate-950 p-3 rounded-lg text-xs font-mono text-slate-300 max-h-40 overflow-y-auto"></div>
        </section>
    </main>

    <!-- Bottom Navigation Bar (SaaS Style) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 py-3 px-6 z-50">
        <div class="max-w-md mx-auto flex justify-around text-slate-400 text-xs">
            <button onclick="switchTab('home')" class="flex flex-col items-center text-purple-400 hover:text-purple-300 transition">
                <i class="fas fa-house text-lg mb-1"></i>
                <span>HOME</span>
            </button>
            <button onclick="openPlans()" class="flex flex-col items-center hover:text-purple-300 transition">
                <i class="fas fa-crown text-lg mb-1"></i>
                <span>PLANS</span>
            </button>
            <button onclick="openAccount()" class="flex flex-col items-center hover:text-purple-300 transition">
                <i class="fas fa-user text-lg mb-1"></i>
                <span>ACCOUNT</span>
            </button>
        </div>
    </nav>

    <!-- JavaScript Logic -->
    <script>
        function showAlert(message, type = 'error') {
            const box = document.getElementById('alertBox');
            box.className = `p-3 rounded-lg text-sm border ${type === 'success' ? 'bg-emerald-950 border-emerald-800 text-emerald-300' : 'bg-rose-950 border-rose-800 text-rose-300'}`;
            box.innerText = message;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 5000);
        }

        function logOutput(msg) {
            const section = document.getElementById('outputSection');
            const consoleBox = document.getElementById('outputConsole');
            section.classList.remove('hidden');
            consoleBox.innerHTML += `> ${msg}<br>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        async function generateRecap() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const fileInput = document.getElementById('recapVideoFile');

            if (!apiKey) {
                showAlert('ကျေးဇူးပြု၍ Google AI API Key ထည့်သွင်းပေးပါခင်ဗျာ။');
                return;
            }
            if (fileInput.files.length === 0) {
                showAlert('ကျေးဇူးပြု၍ Recap လုပ်မည့် ဗီဒီယိုဖိုင်ကို ရွေးချယ်ပေးပါခင်ဗျာ။');
                return;
            }

            logOutput('AI ဖြင့် ဗီဒီယိုကို စတင်ခွဲခြမ်းစိတ်ဖြာနေပါပြီ...');
            showAlert('AI Processing စတင်နေပါပြီ၊ ခဏစောင့်ပါ...', 'success');
            
            // Simulating API Call connection test with Gemini
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Analyze and confirm system readiness for video recap generation." }] }]
                    })
                });

                if (response.ok) {
                    logOutput('API Key အောင်မြင်စွာ ချိတ်ဆက်နိုင်ပါပြီ!');
                    logOutput('ဗီဒီယို ဇာတ်ကြောင်းပြန်ဆိုချက် (Narration) ထုတ်လုပ်နေပါပြီ...');
                    setTimeout(() => {
                        logOutput('Recap ဗီဒီယို အောင်မြင်စွာ ပြီးဆုံးပါပြီ!');
                        showAlert('Recap ဗီဒီယို ထုတ်လုပ်ခြင်း အောင်မြင်သည်!', 'success');
                    }, 2000);
                } else {
                    const err = await response.json();
                    showAlert('API Key မှားယွင်းနေပါသည် (သို့မဟုတ်) Quota ပြည့်နေပါသည်။');
                    logOutput(`Error: ${err.error?.message || 'Connection failed'}`);
                }
            } catch (e) {
                showAlert('ချိတ်ဆက်မှု အမှားအယွင်းရှိပါသည် (VPN သို့မဟုတ် Internet ကို စစ်ဆေးပါ)။');
                logOutput(`Exception: ${e.message}`);
            }
        }

        function cutVideo() {
            const fileInput = document.getElementById('cutVideoFile');
            if (fileInput.files.length === 0) {
                showAlert('ကျေးဇူးပြု၍ ဖြတ်တောက်မည့် ဗီဒီယိုဖိုင်ကို ရွေးချယ်ပေးပါခင်ဗျာ။');
                return;
            }
            logOutput(`ဗီဒီယိုဖိုင် (${fileInput.files[0].name}) ကို စတင်ဖြတ်တောက်နေပါပြီ...`);
            showAlert('ဗီဒီယို ဖြတ်တောက်နေသည်...', 'success');
            setTimeout(() => {
                logOutput('ဗီဒီယို အပိုင်းပိုင်း ဖြတ်တောက်ခြင်း ပြီးစီးပါပြီ!');
                showAlert('ဗီဒီယို ဖြတ်တောက်ခြင်း အောင်မြင်သည်!', 'success');
            }, 2000);
        }

        function openPlans() {
            alert('Automation Eokay Pro Plans: \n- Free Tier: 5 Videos/day\n- Premium SaaS: Unlimited Access ($19/month)');
        }

        function openAccount() {
            alert('Account Profile: Free User\nAPI Key Status: Ready to link.');
        }

        function switchTab(tab) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
